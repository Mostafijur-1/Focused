          cycleNumber,
          plannedSeconds,
          elapsedSeconds,
          remainingSeconds,
          overtimeSeconds,
          startedAt,
          endedAt,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [focus, short_break, long_break] }
        status: { type: string, enum: [running, paused, completed, skipped] }
        cycleNumber: { type: integer, minimum: 1, maximum: 12 }
        plannedSeconds: { type: integer, minimum: 60, maximum: 43200 }
        elapsedSeconds: { type: integer, minimum: 0 }
        remainingSeconds: { type: integer, minimum: 0 }
        overtimeSeconds: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
    PomodoroConfig:
      type: object
