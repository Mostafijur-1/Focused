                            id: { $ref: "#/components/schemas/Uuid" }
                            action: { type: string }
                            actorType: { type: string }
                            targetType: { type: string }
                            occurredAt: { type: string, format: date-time }
                            correlationId: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived asymmetric access token
    refreshCookie:
      type: apiKey
      in: cookie
      name: focused_refresh
      description: Path-scoped, Secure, HttpOnly, SameSite=Lax opaque refresh token
  headers:
    ETag:
      description: Opaque aggregate version validator
      schema: { type: string, examples: ['"v7"'] }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 160 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    PageAfter:
      name: page[after]
      in: query
      required: false
      schema: { type: string, maxLength: 500 }
    PageLimit:
      name: page[limit]
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    LocalDatePath:
      name: date
      in: path
      required: true
      schema: { type: string, format: date }
    FocusSessionId:
      name: focusSessionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    GoalId:
      name: goalId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    HabitId:
      name: habitId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
  responses:
    BadRequest:
      description: The request body is malformed or a one-time security token is invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentication is absent, invalid, expired, or revoked
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Actor lacks permission; privacy-sensitive resources may return 404 instead
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource is unavailable to this actor
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Requested transition conflicts with current domain state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: The aggregate version is stale
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationProblem:
      description: Input or domain validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Request or budget rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: An unexpected server failure occurred; use the correlation ID for support.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: A required provider is unavailable or is not configured
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    HabitResponse:
      description: Current habit representation
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/Habit" }
  schemas:
    HabitKind:
      type: string
      enum: [boolean, count, duration, avoidance]
    HabitTarget:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value: { type: [number, "null"], minimum: 0, maximum: 1000000 }
        unit: { type: [string, "null"], maxLength: 40 }
    HabitSchedule:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, const: daily }
        - type: object
          additionalProperties: false
          required: [type, weekdays]
          properties:
            type: { type: string, const: weekdays }
            weekdays:
              type: array
              minItems: 1
              maxItems: 7
              uniqueItems: true
              items: { type: integer, minimum: 0, maximum: 6 }
        - type: object
          additionalProperties: false
          required: [type, everyDays, anchorDate]
          properties:
            type: { type: string, const: interval }
            everyDays: { type: integer, minimum: 2, maximum: 30 }
            anchorDate: { type: string, format: date }
        - type: object
          additionalProperties: false
          required: [type, dates]
          properties:
            type: { type: string, const: custom_dates }
            dates:
              type: array
              minItems: 1
              maxItems: 128
              uniqueItems: true
              items: { type: string, format: date }
    HabitEntry:
      type: object
      additionalProperties: false
      required:
        [
          id,
          value,
          completed,
          skippedReason,
          note,
          evidenceRef,
          recordedAt,
          correctedAt,
          undoneAt,
          version,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        value: { type: [number, "null"] }
        completed: { type: [boolean, "null"] }
        skippedReason: { type: [string, "null"], maxLength: 160 }
        note: { type: [string, "null"], maxLength: 500 }
        evidenceRef: { type: [string, "null"], format: uuid }
        recordedAt: { type: string, format: date-time }
        correctedAt: { type: [string, "null"], format: date-time }
        undoneAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
    HabitOccurrence:
      type: object
      additionalProperties: false
      required: [id, localDate, status, target, entry]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        localDate: { type: string, format: date }
        status: { type: string, enum: [due, completed, skipped, excused] }
        target: { $ref: "#/components/schemas/HabitTarget" }
        entry:
          oneOf:
            - { $ref: "#/components/schemas/HabitEntry" }
            - { type: "null" }
    Habit:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          kind,
          startsOn,
          paused,
          archived,
          version,
          scheduleVersion,
          today,
          consistency,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        title: { type: string, minLength: 1, maxLength: 160 }
        kind: { $ref: "#/components/schemas/HabitKind" }
        startsOn: { type: string, format: date }
        paused: { type: boolean }
        archived: { type: boolean }
        version: { type: integer, minimum: 1 }
        scheduleVersion:
          type: object
          additionalProperties: false
          required:
            [
              id,
              revision,
              schedule,
              target,
              timeZone,
              effectiveFrom,
              effectiveTo,
            ]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            revision: { type: integer, minimum: 1 }
            schedule: { $ref: "#/components/schemas/HabitSchedule" }
            target: { $ref: "#/components/schemas/HabitTarget" }
            timeZone: { type: string, maxLength: 80 }
            effectiveFrom: { type: string, format: date }
            effectiveTo: { type: [string, "null"], format: date }
        today:
          oneOf:
            - { $ref: "#/components/schemas/HabitOccurrence" }
            - { type: "null" }
        consistency:
          type: object
          additionalProperties: false
          required: [dueCount, completedCount, percentage, currentStreak]
          properties:
            dueCount: { type: integer, minimum: 0 }
            completedCount: { type: integer, minimum: 0 }
            percentage: { type: integer, minimum: 0, maximum: 100 }
            currentStreak: { type: integer, minimum: 0 }
    HabitList:
      type: object
      additionalProperties: false
      required: [localDate, timeZone, active, archived, syncToken]
      properties:
        localDate: { type: string, format: date }
        timeZone: { type: string, maxLength: 80 }
        active:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/Habit" },
          }
        archived:
          {
            type: array,
            maxItems: 150,
            items: { $ref: "#/components/schemas/Habit" },
          }
        syncToken: { type: string, format: date-time }
    HabitHistory:
      type: object
      additionalProperties: false
      required: [habit, occurrences, nextCursor]
      properties:
        habit: { $ref: "#/components/schemas/Habit" }
        occurrences:
          {
            type: array,
            maxItems: 42,
            items: { $ref: "#/components/schemas/HabitOccurrence" },
          }
        nextCursor: { type: [string, "null"], format: date }
    HabitDraftFields:
      type: object
      required: [title, kind, target, schedule]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        kind: { $ref: "#/components/schemas/HabitKind" }
        target: { $ref: "#/components/schemas/HabitTarget" }
        schedule: { $ref: "#/components/schemas/HabitSchedule" }
    CreateHabitRequest:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/HabitDraftFields" }
        - type: object
          required: [startsOn, clientCommandId]
          properties:
            startsOn: { type: string, format: date }
            clientCommandId: { $ref: "#/components/schemas/Uuid" }
    UpdateHabitRequest:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/HabitDraftFields" }
        - type: object
          required: [effectiveOn, expectedVersion]
          properties:
            effectiveOn: { type: string, format: date }
            expectedVersion: { type: integer, minimum: 1 }
    HabitCheckInRequest:
      type: object
      additionalProperties: false
      required:
        [
          localDate,
          value,
          completed,
          skippedReason,
          note,
          evidenceRef,
          clientCommandId,
        ]
      properties:
        localDate: { type: string, format: date }
        value: { type: [number, "null"], minimum: 0, maximum: 1000000 }
        completed: { type: [boolean, "null"] }
        skippedReason: { type: [string, "null"], minLength: 1, maxLength: 160 }
        note: { type: [string, "null"], maxLength: 500 }
        evidenceRef: { type: [string, "null"], format: uuid }
        clientCommandId: { $ref: "#/components/schemas/Uuid" }
        expectedVersion: { type: integer, minimum: 1 }
    HabitStateRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    HabitPauseRequest:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/HabitStateRequest" }
        - type: object
          properties:
            reason: { type: [string, "null"], maxLength: 160 }
    HabitUndoRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, clientCommandId]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        clientCommandId: { $ref: "#/components/schemas/Uuid" }
    DashboardWidgetKey:
      type: string
      enum:
        [
          today_focus,
          active_session,
          weekly_progress,
          habits,
          goals,
          reminders,
          ai_coach,
        ]
    DashboardWidgetSetting:
      type: object
      additionalProperties: false
      required: [key, visible]
      properties:
        key: { $ref: "#/components/schemas/DashboardWidgetKey" }
        visible: { type: boolean }
    DashboardWidgetLayout:
      type: object
      additionalProperties: false
      required: [version, widgets]
      properties:
        version: { type: integer, minimum: 1 }
        widgets:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          items: { $ref: "#/components/schemas/DashboardWidgetSetting" }
    UpdateDashboardWidgetsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, widgets]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        widgets:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          items: { $ref: "#/components/schemas/DashboardWidgetSetting" }
    DashboardDegradation:
      type: object
      additionalProperties: false
      required: [source, code]
      properties:
        source:
          type: string
          enum:
            [
              today_focus,
              focus_sessions,
              weekly_progress,
              habits,
              goals,
              reminders,
              projection_persistence,
            ]
        code:
          type: string
          enum: [source_unavailable, projection_not_persisted]
    DashboardPriority:
      type: object
      additionalProperties: false
      required: [id, title, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        title: { type: string }
        status: { type: string, enum: [planned, in_progress, completed] }
    DashboardTodayFocus:
      type: object
      additionalProperties: false
      required: [state, priorities, completedCount, totalCount]
      properties:
        state: { type: string, enum: [ready, empty, unavailable] }
        priorities:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/DashboardPriority" }
        completedCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 0, maximum: 3 }
    DashboardFocusSession:
      type: object
      additionalProperties: false
      required: [state, session]
      properties:
        state: { type: string, enum: [active, not_configured, unavailable] }
        session:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, intent, kind, status, plannedSeconds, startedAt]
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                intent: { type: string }
                kind: { type: string, enum: [deep_work, pomodoro, custom] }
                status: { type: string, enum: [running, paused] }
                plannedSeconds: { type: integer, minimum: 1 }
                startedAt: { type: string, format: date-time }
    DashboardWeeklyProgress:
      type: object
      additionalProperties: false
      required: [state, completedPriorities, totalPriorities, focusedSeconds]
      properties:
        state: { type: string, enum: [ready, empty, unavailable] }
        completedPriorities: { type: integer, minimum: 0 }
        totalPriorities: { type: integer, minimum: 0 }
        focusedSeconds: { type: integer, minimum: 0 }
    DashboardHabitSummary:
      type: object
      additionalProperties: false
      required: [state, completedCount, dueCount]
      properties:
        state: { type: string, enum: [ready, not_configured, unavailable] }
        completedCount: { type: integer, minimum: 0, maximum: 50 }
        dueCount: { type: integer, minimum: 0, maximum: 50 }
    DashboardGoalSummary:
      type: object
      additionalProperties: false
      required: [state, activeCount, nextGoal]
      properties:
        state: { type: string, enum: [ready, not_configured, unavailable] }
        activeCount: { type: integer, minimum: 0 }
        nextGoal:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, title]
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                title: { type: string }
    DashboardReminderSummary:
      type: object
      additionalProperties: false
      required: [state, dueCount, nextReminder]
      properties:
        state: { type: string, enum: [ready, not_configured, unavailable] }
        dueCount: { type: integer, minimum: 0 }
        nextReminder:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, title, scheduledFor]
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                title: { type: string }
                scheduledFor: { type: string, format: date-time }
    DashboardData:
      type: object
      additionalProperties: false
      required:
        [
          displayName,
          todayFocus,
          focusSession,
          weeklyProgress,
          habits,
          goals,
          reminders,
          aiCoach,
        ]
      properties:
        displayName: { type: string }
        todayFocus: { $ref: "#/components/schemas/DashboardTodayFocus" }
        focusSession: { $ref: "#/components/schemas/DashboardFocusSession" }
        weeklyProgress: { $ref: "#/components/schemas/DashboardWeeklyProgress" }
        habits: { $ref: "#/components/schemas/DashboardHabitSummary" }
        goals: { $ref: "#/components/schemas/DashboardGoalSummary" }
        reminders: { $ref: "#/components/schemas/DashboardReminderSummary" }
        aiCoach:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { type: string, const: coming_soon }
    DashboardSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          localDate,
          timeZone,
          computedAt,
          sourceThrough,
          staleAfter,
          freshness,
          data,
          layout,
          degradations,
        ]
      properties:
        schemaVersion: { type: integer, const: 1 }
        localDate: { type: string, format: date }
        timeZone: { type: string, maxLength: 80 }
        computedAt: { type: string, format: date-time }
        sourceThrough: { type: string, format: date-time }
        staleAfter: { type: string, format: date-time }
        freshness: { type: string, enum: [fresh, stale] }
        data: { $ref: "#/components/schemas/DashboardData" }
        layout: { $ref: "#/components/schemas/DashboardWidgetLayout" }
        degradations:
          type: array
          items: { $ref: "#/components/schemas/DashboardDegradation" }
    Uuid:
      type: string
      format: uuid
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: "^[a-z0-9_]+$" }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              pointer: { type: string }
              code: { type: string }
              message: { type: string }
    PageMetaEnvelope:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: {} }
        page:
          type: object
          required: [hasMore]
          properties:
            next: { type: [string, "null"] }
            hasMore: { type: boolean }
        asOf: { type: string, format: date-time }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 128 }
        deviceName: { type: string, maxLength: 120 }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName, locale, timeZone]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        locale: { type: string, enum: [bn-BD, en] }
        timeZone: { type: string, minLength: 1, maxLength: 80 }
    OneTimeTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 256 }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, locale]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        locale: { type: string, enum: [bn-BD, en] }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 256 }
        password: { type: string, minLength: 12, maxLength: 128 }
    AcceptedMessage:
      type: object
      additionalProperties: false
      required: [accepted, message]
      properties:
        accepted: { type: boolean, const: true }
        message: { type: string }
    VerifiedResult:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified: { type: boolean, const: true }
    ResetResult:
      type: object
      additionalProperties: false
      required: [reset]
      properties:
        reset: { type: boolean, const: true }
    SessionTokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, sessionId, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 60, maximum: 900 }
        sessionId: { $ref: "#/components/schemas/Uuid" }
        user:
          type: object
          required: [id, displayName, permissions]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            displayName: { type: string }
            permissions: { type: array, items: { type: string } }
    AuthSession:
      type: object
      additionalProperties: false
      required: [id, status, lastSeenAt, expiresAt, createdAt, current]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
        deviceName: { type: [string, "null"], maxLength: 120 }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        current: { type: boolean }
    RevocationResult:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked: { type: boolean, const: true }
    UserProfile:
      type: object
      required: [userId, displayName, timeZone, locale, weekStartsOn, version]
      properties:
        userId: { $ref: "#/components/schemas/Uuid" }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        avatarUrl: { type: [string, "null"], format: uri }
        timeZone: { type: string, maxLength: 80 }
        locale: { type: string, maxLength: 20 }
        weekStartsOn: { type: integer, minimum: 0, maximum: 6 }
        version: { type: integer, minimum: 1 }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        timeZone: { type: string, maxLength: 80 }
        locale: { type: string, maxLength: 20 }
        weekStartsOn: { type: integer, minimum: 0, maximum: 6 }
    PlanItem:
      type: object
      required: [id, title, status, isPrimary, position, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        goalId: { type: [string, "null"], format: uuid }
        title: { type: string, maxLength: 240 }
        status:
          {
            type: string,
            enum: [PLANNED, IN_PROGRESS, COMPLETED, DEFERRED, CANCELLED],
          }
        isPrimary: { type: boolean }
        estimateMinutes: { type: [integer, "null"], minimum: 1, maximum: 1440 }
        position: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
    DailyPlan:
      type: object
      required: [id, date, timeZone, status, items, notDoing, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        date: { type: string, format: date }
        timeZone: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, CLOSED, ARCHIVED] }
        capacityMinutes: { type: [integer, "null"], minimum: 0, maximum: 1440 }
        items:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/PlanItem" },
          }
        notDoing:
          { type: array, maxItems: 30, items: { type: string, maxLength: 240 } }
        version: { type: integer, minimum: 1 }
    PutDailyPlanRequest:
      type: object
      additionalProperties: false
      required: [timeZone, items]
      properties:
        timeZone: { type: string, maxLength: 80 }
        capacityMinutes: { type: integer, minimum: 0, maximum: 1440 }
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [clientId, title, isPrimary, position]
            properties:
              id: { type: string, format: uuid }
              clientId: { type: string, maxLength: 100 }
              goalId: { type: string, format: uuid }
              title: { type: string, minLength: 1, maxLength: 240 }
              isPrimary: { type: boolean }
              estimateMinutes: { type: integer, minimum: 1, maximum: 1440 }
              position: { type: integer, minimum: 0 }
        notDoing:
          { type: array, maxItems: 30, items: { type: string, maxLength: 240 } }
    FocusSession:
      type: object
      required:
        [
          id,
          kind,
          status,
          intent,
          plannedSeconds,
          startedAt,
          pausedSeconds,
          focusedSeconds,
          interruptionCount,
          timeZone,
          version,
          serverNow,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        goalId: { type: [string, "null"], format: uuid }
        goalTitle: { type: [string, "null"] }
        pomodoroPresetId: { type: [string, "null"], format: uuid }
        kind: { type: string, enum: [deep_work, pomodoro, custom] }
        status: { type: string, enum: [running, paused, completed, abandoned] }
        intent: { type: string }
        plannedSeconds: { type: integer, minimum: 60, maximum: 43200 }
        pausedSeconds: { type: integer, minimum: 0 }
        focusedSeconds: { type: integer, minimum: 0 }
        interruptionCount: { type: integer, minimum: 0 }
        timeZone: { type: string, maxLength: 80 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        abandonedAt: { type: [string, "null"], format: date-time }
