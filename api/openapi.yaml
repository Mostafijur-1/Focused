openapi: 3.1.0
info:
  title: Focused REST API
  version: 1.0.0
  summary: Mobile-neutral public contract for Focused FocusOS
  description: |
    Architecture baseline. Domain route handlers are generated/registered from the
    same Zod contracts used by transport adapters. Private resources are owner-scoped;
    authorization is never implied by endpoint visibility.
  contact:
    name: Focused Engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://focused.example/api/v1
    description: Production
  - url: https://{previewHost}/api/v1
    description: Preview
    variables:
      previewHost:
        default: focused-preview.vercel.app
tags:
  - name: Platform
    description: Public service health and contract metadata.
  - name: Authentication
    description: Identity, OAuth, access tokens, refresh rotation, and session lifecycle.
  - name: Profile
    description: Member-owned profile, locale, time-zone, and preference resources.
  - name: Dashboard
    description: Owner-scoped, privacy-filtered Dashboard projections and widget preferences.
  - name: Habits
    description: Owner-scoped habits, immutable schedule versions, occurrences, and correction history.
  - name: Daily Focus
    description: Daily commitments, capacity, and close-out decisions.
  - name: Focus Sessions
    description: Deep-work and Pomodoro session state transitions.
  - name: Goals
    description: Outcome-oriented goals, milestones, and check-ins.
  - name: Reminders
    description: One-time and recurring reminder rules and occurrences.
  - name: Notifications
    description: In-app notifications, preferences, and Web Push subscriptions.
  - name: AI
    description: Provider-neutral scoped AI runs routed through approved Groq or Gemini adapters, with streams, evidence, and user-approved proposals.
  - name: Jobs
    description: Durable asynchronous reports, exports, and status resources.
  - name: Administration
    description: Least-privilege operational and audit resources.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Platform]
      summary: Check service availability
      description: Returns process availability only; dependency readiness is exposed through protected operations telemetry.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is available
          headers:
            X-Request-Id:
              description: Correlation identifier for this request.
              schema: { type: string }
            Cache-Control:
              description: Health responses are never cached.
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, version, timestamp]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: focused-web }
                  version: { type: string }
                  timestamp: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Read the current member Dashboard
      operationId: getDashboard
      description: Returns a bounded, privacy-filtered projection for the member-local day. Stale and partially degraded data is disclosed explicitly.
      responses:
        "200":
          description: Current or safely degraded Dashboard projection
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
            Vary:
              schema: { type: string, const: Authorization }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DashboardSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /dashboard/widgets:
    patch:
      tags: [Dashboard]
      summary: Update Dashboard widget visibility and order
      operationId: updateDashboardWidgets
      description: Uses optimistic concurrency. The primary Focus widget must remain visible and first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateDashboardWidgetsRequest" }
      responses:
        "200":
          description: Updated widget layout
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DashboardWidgetLayout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /habits:
    get:
      tags: [Habits]
      summary: List the current member's habits
      operationId: listHabits
      description: Expands a bounded occurrence window in the member's time zone before returning active and archived habits.
      responses:
        "200":
          description: Habit list for the member-local day
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/HabitList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Habits]
      summary: Create a habit
      operationId: createHabit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHabitRequest" }
      responses:
        "201": { $ref: "#/components/responses/HabitResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /habits/{habitId}:
    parameters:
      - { $ref: "#/components/parameters/HabitId" }
    patch:
      tags: [Habits]
      summary: Change a habit from an effective local date
      operationId: updateHabit
      description: Creates an immutable schedule version; historical occurrences and entries are not rewritten.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHabitRequest" }
      responses:
        "200": { $ref: "#/components/responses/HabitResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /habits/{habitId}/entries:
    parameters:
      - { $ref: "#/components/parameters/HabitId" }
    get:
      tags: [Habits]
      summary: Read bounded habit history
      operationId: getHabitHistory
      parameters:
        - name: cursor
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Reverse-chronological occurrence history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/HabitHistory" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
    post:
      tags: [Habits]
      summary: Record or correct a habit entry
      operationId: recordHabitEntry
      description: clientCommandId makes retries idempotent; expectedVersion is required for corrections.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitCheckInRequest" }
      responses:
        "200": { $ref: "#/components/responses/HabitResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /habits/{habitId}/entries/undo:
    parameters:
      - { $ref: "#/components/parameters/HabitId" }
    post:
      tags: [Habits]
      summary: Undo today's habit entry
      operationId: undoHabitEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitUndoRequest" }
      responses:
        "200": { $ref: "#/components/responses/HabitResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /habits/{habitId}/pause:
    parameters:
      - { $ref: "#/components/parameters/HabitId" }
    post:
      tags: [Habits]
      summary: Pause a habit without harming consistency
      operationId: pauseHabit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitPauseRequest" }
      responses:
        "200": { $ref: "#/components/responses/HabitResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /habits/{habitId}/resume:
    parameters:
      - { $ref: "#/components/parameters/HabitId" }
    post:
      tags: [Habits]
      summary: Resume a paused habit after the member-local day
      operationId: resumeHabit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitStateRequest" }
      responses:
        "200": { $ref: "#/components/responses/HabitResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /habits/{habitId}/archive:
    parameters:
      - { $ref: "#/components/parameters/HabitId" }
    post:
      tags: [Habits]
      summary: Archive a habit
      operationId: archiveHabit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitStateRequest" }
      responses:
        "200": { $ref: "#/components/responses/HabitResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Habits]
      summary: Restore an archived habit
      operationId: restoreHabit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitStateRequest" }
      responses:
        "200": { $ref: "#/components/responses/HabitResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a password-based member account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: The verification request was accepted; the response is intentionally enumeration-safe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedMessage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify an email address using a single-use token
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OneTimeTokenRequest" }
      responses:
        "200":
          description: Email address verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifiedResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a member and create a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              description: Secure HttpOnly refresh-token cookie for browser clients
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokenResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a single-use password-reset link
      description: Always returns the same accepted response, including for an unknown address.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202":
          description: The recovery request was accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedMessage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Replace a password using a single-use recovery token
      description: Successful reset revokes every existing session for the member.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Password reset completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the refresh token and issue a new access token
      operationId: refreshSession
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Rotated session tokens
          headers:
            Set-Cookie:
              description: Rotated Secure HttpOnly refresh-token cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokenResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      operationId: logout
      security:
        - refreshCookie: []
        - {}
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Session revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/oauth/{provider}/start:
    post:
      tags: [Authentication]
      summary: Start an OAuth Authorization Code with PKCE flow
      operationId: startOAuth
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [locale, timeZone, returnTo]
              properties:
                locale: { type: string, enum: [bn-BD, en] }
                timeZone: { type: string, minLength: 1, maxLength: 80 }
                returnTo:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Same-origin application path validated by the server
      responses:
        "200":
          description: Provider authorization request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorizationUrl, expiresAt]
                properties:
                  authorizationUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/oauth/{provider}/callback:
    get:
      tags: [Authentication]
      summary: Complete an OAuth Authorization Code with PKCE flow
      description: Validates the provider response, server-held PKCE verifier, state cookie, and OIDC nonce where applicable.
      operationId: completeOAuth
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google] }
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
      responses:
        "303":
          description: Session established and redirected to the validated same-origin destination
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie:
              description: Secure HttpOnly refresh-token cookie and CSRF cookie
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /users/me/sessions:
    get:
      tags: [Authentication]
      summary: List the current member's active and recent sessions
      operationId: listMySessions
      responses:
        "200":
          description: Member-owned session list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users/me/sessions/{sessionId}:
    delete:
      tags: [Authentication]
      summary: Revoke one member-owned session
      operationId: revokeMySession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/me/sessions/logout-all:
    post:
      tags: [Authentication]
      summary: Revoke every other session owned by the current member
      operationId: logoutAllOtherSessions
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users/me/profile:
    get:
      tags: [Profile]
      summary: Get the current member profile
      operationId: getMyProfile
      responses:
        "200":
          description: Current member profile
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Profile]
      summary: Update the current member profile
      operationId: updateMyProfile
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated profile
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /daily-plans/{date}:
    get:
      tags: [Daily Focus]
      summary: Get a daily focus plan
      operationId: getDailyPlan
      parameters:
        - $ref: "#/components/parameters/LocalDatePath"
      responses:
        "200":
          description: Daily plan
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyPlan" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Daily Focus]
      summary: Create or replace a daily focus plan
      operationId: putDailyPlan
      parameters:
        - $ref: "#/components/parameters/LocalDatePath"
        - $ref: "#/components/parameters/IfMatchOptional"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutDailyPlanRequest" }
      responses:
        "200":
          description: Updated daily plan
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyPlan" }
        "201":
          description: Created daily plan
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyPlan" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /daily-plans/{date}/completion:
    post:
      tags: [Daily Focus]
      summary: Close a daily plan with explicit item decisions
      operationId: closeDailyPlan
      parameters:
        - $ref: "#/components/parameters/LocalDatePath"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decisions]
              properties:
                decisions:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [itemId, outcome]
                    properties:
                      itemId: { $ref: "#/components/schemas/Uuid" }
                      outcome:
                        { type: string, enum: [COMPLETED, DEFERRED, CANCELLED] }
                      reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Closed plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyPlan" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /focus-sessions:
    get:
      tags: [Focus Sessions]
      summary: List focus sessions
      operationId: listFocusSessions
      parameters:
        - $ref: "#/components/parameters/PageAfter"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Cursor-paginated focus sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMetaEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/FocusSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Focus Sessions]
      summary: Start a focus session
      operationId: startFocusSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartFocusSessionRequest" }
      responses:
        "201":
          description: Started session
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusSession" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /focus-sessions/{focusSessionId}/pauses:
    post:
      tags: [Focus Sessions]
      summary: Pause an active focus session
      operationId: pauseFocusSession
      parameters:
        - $ref: "#/components/parameters/FocusSessionId"
      requestBody:
