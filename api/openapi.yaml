      type: object
      additionalProperties: false
      required:
        [conversationId, clientRequestId, locale, message, contextScopes]
      properties:
        conversationId: { type: [string, "null"], format: uuid }
        clientRequestId: { $ref: "#/components/schemas/Uuid" }
        locale: { type: string, enum: [bn-BD, en] }
        message: { type: string, minLength: 1, maxLength: 2000 }
        contextScopes:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { $ref: "#/components/schemas/AIContextScope" }
    DailyReviewRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, locale, contextScopes, includeGoalProposal]
      properties:
        clientRequestId: { $ref: "#/components/schemas/Uuid" }
        locale: { type: string, enum: [bn-BD, en] }
        contextScopes:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { $ref: "#/components/schemas/AIContextScope" }
        includeGoalProposal: { type: boolean }
    GoalProposalPatch:
      type: object
      additionalProperties: false
      required:
        [title, description, horizon, priority, successMeasure, targetDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        horizon: { type: string, enum: [month, quarter, year] }
        priority: { type: integer, minimum: 1, maximum: 3 }
        successMeasure: { type: [string, "null"], maxLength: 500 }
        targetDate: { type: [string, "null"], format: date }
    AIProposal:
      type: object
      required:
        [id, runId, targetType, operation, patch, status, expiresAt, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        runId: { $ref: "#/components/schemas/Uuid" }
        targetType: { type: string, enum: [goal] }
        operation: { type: string, enum: [create] }
        patch: { $ref: "#/components/schemas/GoalProposalPatch" }
        editedPatch:
          {
            anyOf:
              [
                { $ref: "#/components/schemas/GoalProposalPatch" },
                { type: "null" },
              ],
          }
        rationale: { type: string }
        status:
          {
            type: string,
            enum:
              [
                pending,
                applying,
                accepted,
                apply_failed,
                rejected,
                expired,
                superseded,
              ],
          }
        expiresAt: { type: string, format: date-time }
        appliedResourceId: { type: [string, "null"], format: uuid }
        version: { type: integer, minimum: 1 }
    AIRun:
      type: object
      required:
        [
          id,
          kind,
          state,
          locale,
          promptVersion,
          policyVersion,
          scopes,
          usage,
          queuedAt,
          proposals,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        conversationId: { type: [string, "null"], format: uuid }
        kind: { type: string, enum: [coach, daily_review] }
        state:
          {
            type: string,
            enum: [queued, running, completed, failed, cancelled, expired],
          }
        locale: { type: string, enum: [bn-BD, en] }
        promptVersion: { type: string }
        policyVersion: { type: string }
        provider:
          { type: [string, "null"], enum: [groq, gemini, deterministic, null] }
        model: { type: [string, "null"] }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/AIContextScope" }
        output: { type: [object, "null"] }
        usage:
          type: object
          properties:
            inputTokens: { type: [integer, "null"] }
            outputTokens: { type: [integer, "null"] }
        failureCode: { type: [string, "null"] }
        queuedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/AIProposal" }
    Job:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status:
          {
            type: string,
            enum:
              [QUEUED, RUNNING, COMPLETED, PARTIAL, FAILED, CANCELLED, EXPIRED],
          }
        progress: { type: number, minimum: 0, maximum: 1 }
        downloadUrl: { type: [string, "null"], format: uri }
        expiresAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        failureCode: { type: [string, "null"] }
