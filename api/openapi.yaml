          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            name: { type: string, minLength: 1, maxLength: 80 }
            isDefault: { type: boolean }
            version: { type: integer, minimum: 1 }
    CreatePomodoroPresetRequest:
      type: object
      additionalProperties: false
      required: [name, config, isDefault, clientCommandId]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        config: { $ref: "#/components/schemas/PomodoroConfig" }
        isDefault: { type: boolean }
        clientCommandId: { $ref: "#/components/schemas/Uuid" }
    Goal:
      type: object
      additionalProperties: false
      required:
        [
          id,
          parentGoalId,
          title,
          description,
          status,
          horizon,
          priority,
          position,
          progressMode,
          progress,
          successMeasure,
          targetValue,
          targetUnit,
          targetDate,
          overdue,
          archived,
          version,
          createdAt,
          updatedAt,
          milestones,
          keyResults,
          links,
          recentCheckIns,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        parentGoalId: { type: [string, "null"], format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        status:
          {
            type: string,
            enum: [draft, active, paused, achieved, abandoned, archived],
          }
        horizon: { type: string }
        priority: { type: integer, minimum: 1, maximum: 3 }
        position: { type: integer, minimum: 0 }
        progressMode: { type: string, enum: [manual, milestones, key_results] }
        progress: { type: number, minimum: 0, maximum: 100 }
        successMeasure: { type: [string, "null"] }
        targetValue: { type: [number, "null"] }
        targetUnit: { type: [string, "null"], maxLength: 40 }
        targetDate: { type: [string, "null"], format: date }
