          longBreakSeconds,
          cycles,
          longBreakEvery,
          autoStartBreaks,
          autoStartFocus,
          audioEnabled,
          vibrationEnabled,
        ]
      properties:
        focusSeconds: { type: integer, minimum: 60, maximum: 10800 }
        shortBreakSeconds: { type: integer, minimum: 60, maximum: 3600 }
        longBreakSeconds: { type: integer, minimum: 60, maximum: 7200 }
        cycles: { type: integer, minimum: 1, maximum: 12 }
        longBreakEvery: { type: integer, minimum: 1, maximum: 12 }
        autoStartBreaks: { type: boolean, default: false }
        autoStartFocus: { type: boolean, default: false }
        audioEnabled: { type: boolean, default: true }
        vibrationEnabled: { type: boolean, default: false }
    PomodoroPreset:
      allOf:
        - $ref: "#/components/schemas/PomodoroConfig"
